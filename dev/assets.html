<!doctype html>
<html><head><meta charset="utf-8"><title>Berkeley Simulator — asset library</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9fb6cc;font:12px system-ui}#info{position:fixed;left:8px;top:8px;color:#fff;text-shadow:0 1px 2px #000;white-space:pre;pointer-events:none}
#ui{position:fixed;right:8px;top:8px;background:rgba(0,0,0,.45);color:#fff;padding:6px 8px;border-radius:6px}#ui select,#ui input{font:12px system-ui}</style>
</head><body><div id="info">loading…</div>
<div id="ui">season <select id="season"><option>spring</option><option>summer</option><option>early-autumn</option><option selected>late-autumn</option><option>winter</option></select>
 night <input id="night" type="range" min="0" max="1" step="0.05" value="0"> wind <input id="wind" type="range" min="0" max="1.5" step="0.05" value="0.4"></div>
<script type="module" src="./assets.js"></script>
</body></html>
