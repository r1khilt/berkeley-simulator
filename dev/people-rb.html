<!doctype html><html><head><meta charset="utf-8"><title>rocketbox people harness</title><style>html,body{margin:0;background:#9db4c8}canvas{display:block}</style></head>
<body><script type="module">
// r4-people3 dev harness: Rocketbox near-LOD people next to the Quaternius ones, in any state (?ids=female_08,male_12 &states=walk,idle &ubc=1 &cam=x,y,z,tx,ty,tz &t=)
import * as THREE from 'three';
import { loadPeopleAssets } from '/src/people/assets.js';
import { Character } from '/src/people/character.js';
import { loadRocketbox, RBCharacter } from '/src/people/rocketbox.js';
import { calibrate } from '/src/people/index.js';
import { SKIN, HAIR, SHOE, randomLook } from '/src/life/people.js';
const qs = new URLSearchParams(location.search);
const W = +(qs.get('w') || 1280), H = +(qs.get('h') || 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9db4c8);
scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x6b5b45, 1.4)); const sun = new THREE.DirectionalLight(0xfff1dc, 2.6); sun.position.set(-6, 10, 7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 0.95 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(+(qs.get('fov') || 35), W / H, 0.05, 200);
const A = await loadPeopleAssets(); A.palette = { SKIN, HAIR, SHOE };
const ids = (qs.get('ids') || 'female_08,male_12').split(',');
const t0 = performance.now(); const avs = await loadRocketbox(A, { only: ids, renderer }); window.loadMs = performance.now() - t0;
const states = (qs.get('states') || 'idle').split(',');
let seed = +(qs.get('seed') || 7); const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const chars = []; const gap = +(qs.get('gap') || 0.9);
const list = []; for (const id of ids) { const av = avs.find((a) => a.id === id); if (av) list.push(av); }
const nUbc = +(qs.get('ubc') || 0);
const N = list.length + nUbc;
for (let i = 0; i < N; i++) {
  const st = states[i % states.length]; const look = randomLook(rand);
  let c; if (i < nUbc) { look.fem = i % 2 ? 0 : 1; c = new Character(A, look.fem ? 'f' : 'm', true); calibrate(c); } else { const av = list[i - nUbc]; look.fem = av.sex === 'f' ? 1 : 0; c = new RBCharacter(av, true); calibrate(c); }
  if (qs.get('pack')) look.flags |= 4; else look.flags &= ~4;
  scene.add(c.root); c.root.visible = true;
  const a = { kind: st === 'sit' || st === 'lawn' || st === 'lie' || st === 'talk' ? 'spot' : st === 'cycle' || st === 'scoot' ? 'rider' : 'walker', scooter: st === 'scoot', x: (i - (N - 1) / 2) * gap, y: 0, z: 0, heading: +(qs.get('yaw') || 0), speed_: st === 'walk' ? 1.3 : st === 'jog' ? 3 : 0, state: st === 'walk' ? 'walk' : st === 'jog' ? 'jog' : st === 'talk' ? 'talk' : st === 'phone' ? 'phone' : st === 'sit' ? 'sit' : st === 'lawn' ? 'lawn' : st === 'lie' ? 'lie' : 'idle', phase: 0, vari: i % 4, aux: st === 'sit' ? 0.46 : 0, look, extra: 0, seed: 0.3 + i * 0.07 };
  c.setLook(look, a.extra, a.seed); chars.push([c, a]);
}
window.chars = chars;
const t = +(qs.get('t') || 0.5);
for (const [c, a] of chars) { for (const k in c.w) c.w[k] = 0; c.update(0.001, a, camera); for (const k in c.w) c.w[k] = c.wt[k]; c.update(t, a, camera); if (a.state === 'walk' || a.state === 'jog') { a.phase += t * 6; c.update(0.016, a, camera); } }
const cam = (qs.get('cam') || `0,1.5,${Math.max(4, N * 1.1)},0,0.9,0`).split(',').map(Number);
camera.position.set(cam[0], cam[1], cam[2]); camera.lookAt(cam[3], cam[4], cam[5]);
renderer.render(scene, camera); window.ready = true;
window.step = (dt, n = 1) => { for (let k = 0; k < n; k++) for (const [c, a] of chars) { if (a.state === 'walk' || a.state === 'jog') a.phase += dt * 6.2831 * a.speed_ / (a.state === 'jog' ? 2.25 : 1.42); c.update(dt, a, camera); } renderer.render(scene, camera); };
window.setCam = (a) => { camera.position.set(a[0], a[1], a[2]); camera.lookAt(a[3], a[4], a[5]); renderer.render(scene, camera); };
</script></body></html>
