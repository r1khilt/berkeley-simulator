<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f4">
<title>UI harness · Berkeley Simulator</title>
<link rel="stylesheet" href="/src/ui/style.css">
<style>#bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }</style>
</head><body>
<!-- UI harness: renders every UI surface over a still frame without WebGL. ?s=landing|loading|hud|map|time|settings|help|avatar|touch&night=1&bg=play|title -->
<img id="bg" alt=""><canvas id="c" style="display:none"></canvas><div id="ui"></div>
<script type="module">
import { UI } from '/src/ui/ui.js';
import { icon, ICON_NAMES } from '/src/ui/icons.js';
import { PLACES } from '/src/places.js';
const q = new URLSearchParams(location.search), s = q.get('s') || 'hud', night = !!q.get('night');
document.getElementById('bg').src = `/dev-data/${q.get('bg') || (s === 'landing' ? 'bg-title' : 'bg-play')}${night ? '-night' : ''}.jpg`;
const ui = new UI(document.getElementById('ui')); window.ui = ui;
if (q.get('theme')) ui.setTheme(q.get('theme'));
// fake map: blocks, roads, lawns
const cv = document.createElement('canvas'); cv.width = 1600; cv.height = 1200; const c = cv.getContext('2d');
c.fillStyle = '#ecebe5'; c.fillRect(0, 0, 1600, 1200); c.fillStyle = '#cfe3c0'; c.fillRect(420, 300, 520, 360); c.fillRect(1000, 640, 300, 240);
c.strokeStyle = '#fff'; c.lineWidth = 14; for (let x = 60; x < 1600; x += 230) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 40, 1200); c.stroke(); } for (let y = 80; y < 1200; y += 210) { c.beginPath(); c.moveTo(0, y); c.lineTo(1600, y - 30); c.stroke(); }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 260; i++) { const x = rnd() * 1560, y = rnd() * 1160, w = 18 + rnd() * 50, h = 14 + rnd() * 40; c.fillStyle = rnd() < 0.08 ? '#eadcb8' : '#dcd8cf'; c.strokeStyle = '#c3bdb1'; c.lineWidth = 1; c.fillRect(x, y, w, h); c.strokeRect(x, y, w, h); }
const places = PLACES.map((p) => ({ ...p })).slice(0, 40); places.slice(0, 8).forEach((p) => (p.landmark = true)); places[2].found = true; places[5].found = true; places[11].found = true;
ui.setMap({ canvas: cv, x0: -800, z0: -500, ppm: 1, places });
const player = { mode: 'walk', speed: 0, touch: {}, plugins: { scooter: { key: 'KeyG', label: 'Lime scooter', icon: 'scooter', hint: 'Walk up to a parked Lime and press G' }, hoverboard: { key: 'KeyJ', label: 'Hoverboard', icon: 'hoverboard' }, horse: { key: 'KeyK', label: 'Horse', icon: 'horse' }, grapple: { tool: true, label: 'Grappling hook', hint: 'Right-click a wall to grapple' } }, setMode(m) { this.mode = m; }, lookDelta() {} };
if (q.get('mode')) { player.mode = q.get('mode'); player.speed = 5.6; }
ui.bindPlayer(player); ui.count(12, 290);
const st = { live: false, hour: 13.5, date: null, weather: q.get('wx') || 'live', wx: { temperature_2m: 14.2, weather_code: 1, cloud_cover: 35 }, label: '58°F · Partly cloudy', autoDay: q.get('auto') ? new Date('2026-11-20T19:02:00-08:00') : null };
const setT = (k, v) => { if (k === 'hour') { st.hour = v; st.live = false; } if (k === 'live') st.live = v; if (k === 'date') st.date = v; if (k === 'weather') st.weather = v; if (k === 'preset') { st.hour = { morning: 9, noon: 11.92, golden: 16.42, sunset: 16.67, night: 21.5 }[v]; st.live = false; } st.autoDay = null; };
const clock = () => { const h = st.hour, hh = Math.floor(h), mm = Math.round((h - hh) * 60); ui.clock(`${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')} <b>${hh >= 12 ? 'PM' : 'AM'}</b>`, st.label, st); };
ui.setNight(night ? 1 : 0);
const settings = { quality: 'high', sens: 1, invertY: false, fov: 62, volume: 0.7, north: false };
ui.on('time', () => ui.timePanel(st, setT)); ui.on('settings', () => ui.settings(settings, (k, v) => { settings[k] = v; })); ui.on('map', () => openMap());
const openMap = () => ui.openMap({ px: 0, pz: 0, heading: 0.6, places, search: [{ name: 'Evans Hall', p: [120, -80] }, { name: 'Etcheverry Hall', p: [300, -300] }], onTravel: (x, z, p) => console.log('travel', x, z, p && p.name) });
const hud = () => { ui.showTitle(false); clock(); ui.location('Sproul Plaza', 'Free Speech Movement, 1964'); ui.minimap(0, 0, 0.6, false); ui.compass(326); ui.modes(); };
if (s === 'icons') { document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:0;z-index:50;background:#fff;color:#1c1c1e;display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:16px;font:12px Inter">${ICON_NAMES.map((n) => `<div style="display:grid;justify-items:center;gap:4px"><div style="width:44px;height:44px">${icon(n).replace('class="i ', 'style="width:44px;height:44px" class="')}</div>${n}</div>`).join('')}</div>`); }
else if (s === 'loading') { ui.progress(0.42); ui.note('Loading terrain, buildings and trees…'); }
else if (s === 'landing') { ui.progress(1); ui.titleTime(st); ui.ready(); ui.titlePlace('Sather Tower'); }
else {
  ui.ready(); hud();
  if (s === 'hud') { ui.toast({ kind: 'Discovered', name: 'Sather Gate', sub: 'Landmark · 1910', blurb: 'The bronze-and-granite gate that marks the old southern entrance to campus.' }, 1e9); ui.prompt('Ride the elevator to the observation deck'); ui.notify("Showing 1:30 PM because it's dark in Berkeley right now", { icon: 'sun', ms: 1e9 }); ui.hint('<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move <i></i> <kbd>Shift</kbd> Run <i></i> <kbd>M</kbd> Map <i></i> <kbd>T</kbd> Time <i></i> <kbd>H</kbd> Controls', 1e9); }
  if (s === 'map') { openMap(); if (q.get('search')) { const i = document.querySelector('.bigmap input'); i.value = q.get('search'); i.dispatchEvent(new Event('input')); } }
  if (s === 'time') ui.timePanel(st, setT);
  if (s === 'settings') ui.settings(settings, () => {});
  if (s === 'help') ui.help();
  if (s === 'avatar') ui.customize({ skin: 1, hair: 2, hairStyle: 0, top: 0, pants: 0, backpack: true }, () => {});
  if (s === 'touch') { ui.touchControls(player, {}); ui.prompt('Ride the elevator'); }
}
window.harnessReady = true;
</script>
</body></html>
