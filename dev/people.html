<!doctype html><html><head><meta charset="utf-8"><title>people lineup</title><style>html,body{margin:0;background:#888}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';
import { personGeometry, personMaterials, CrowdMesh, randomLook, POSE, FLAG } from '/src/life/people.js';
import { makeBike, makeScooter } from '/src/life/vehicles.js';
import { U } from '/src/materials.js';
const qs = new URLSearchParams(location.search);
const W = +(qs.get('w') || 1280), H = +(qs.get('h') || 720);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(W, H); r.shadowMap.enabled = true;
r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb8c8d8);
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
const sun = new THREE.DirectionalLight(0xfff2e0, 3.2); sun.position.set(-6, 10, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6a6050, 1.3));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x8a8478, roughness: 0.95 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const lod = +(qs.get('lod') ?? 1);
const geo = personGeometry(lod); const mats = personMaterials(); const crowd = new CrowdMesh(geo, mats, 64, 'people'); scene.add(crowd.mesh);
let seed = +(qs.get('seed') || 3); const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
// lineup: [pose, variant, aux]
const list = (qs.get('poses') || 'w0,w1,w3,j,s0,s1,s2,s4,s6,b0,b1,b2,b3,b4,g0,g1,g2,g3,l0,l1,c,k').split(',');
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
const yaw = +(qs.get('yaw') || 2.64);
const vehicles = [];
const bike = makeBike(), scoot = makeScooter();
crowd.begin();
list.forEach((code, i) => {
  const look = randomLook(rand);
  const x = (i - (list.length - 1) / 2) * 1.3, z = 0;
  let pose = 1, v = 0, aux = 0, ph = (+(qs.get('ph') || 0.9)) + i * 0.7, extra = 0;
  const k = code[0], n = +code.slice(1) || 0;
  if (k === 'w') { pose = POSE.WALK; v = n; if (n === 1) extra = FLAG.PHONE; if (n === 2) extra = FLAG.CUP; }
  if (k === 'j') { pose = POSE.WALK; aux = 1; }
  if (k === 's') { pose = POSE.STAND; v = n; if (n === 2) extra = FLAG.PHONE; if (n === 5) extra = FLAG.CUP; }
  if (k === 'b') { pose = POSE.SIT; v = n; aux = 0.46; if (n === 1) extra = FLAG.PHONE; if (n === 4) extra = FLAG.BOOK; }
  if (k === 'g') { pose = POSE.GROUND; v = n; if (n === 4) extra = FLAG.BOOK; }
  if (k === 'l') { pose = POSE.LIE; v = n; if (n === 1) extra = FLAG.BOOK; }
  if (k === 'c') { pose = POSE.CYCLE; aux = ph; }
  if (k === 'k') { pose = POSE.SCOOTER; }
  if (pose === POSE.SIT) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.46, 0.45), new THREE.MeshStandardMaterial({ color: 0x777777 })); s.position.set(x, 0.23, z + 0.15); s.rotation.y = yaw; s.castShadow = s.receiveShadow = true; scene.add(s); }
  if (pose === POSE.CYCLE || pose === POSE.SCOOTER) { const vh = (pose === POSE.CYCLE ? bike : scoot).clone(); vh.position.set(x, 0, z); vh.rotation.y = yaw; scene.add(vh); }
  m4.compose(new THREE.Vector3(x, 0, z), q.setFromAxisAngle(up, yaw), new THREE.Vector3(look.w, look.h, look.w));
  crowd.push(m4.elements, look, ph % (Math.PI * 2), pose, v, aux, extra);
});
crowd.end();
const cv = (qs.get('cam') || '0,1.8,10.5,0,0.75,0').split(',').map(Number);
cam.position.set(cv[0], cv[1], cv[2]); cam.lookAt(cv[3], cv[4], cv[5]);
U.uTime.value = +(qs.get('t') || 1);
r.render(scene, cam);
window.DONE = true;
</script></body></html>
